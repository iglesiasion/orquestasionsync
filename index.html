<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrquestaSIONsync v7.1 - Panel Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        .himno-card-img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .himno-card-img:hover { border-color: #6366f1; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
        .sheet-zoom { transition: transform 0.2s ease-out; transform-origin: center center; }
        .blackout { background-color: #000 !important; opacity: 0 !important; transition: opacity 0.5s; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col overflow-x-hidden lg:overflow-hidden select-none">
    
    <script>
        // ... (Toda la lógica de variables y funciones de conexión igual que la que me pasaste) ...

        // Lógica del Músico Integrada (La versión que sí hacía scroll)
        function renderMusicoPantalla() {
            if (activeRole !== 'musician') return;

            const waitBox = document.getElementById('musicianWaitText');
            const contentWrapper = document.getElementById('musicianContentWrapper');
            const singleImg = document.getElementById('musicianSheetImg');
            const libreScroll = document.getElementById('musicianLibreScroll');
            const musicianPanel = document.getElementById('musicianPanel');

            musicianPanel.classList.remove('hidden');

            if (isMusicianSyncMode) {
                contentWrapper.classList.remove('hidden');
                singleImg.classList.remove('hidden');
                libreScroll.classList.add('hidden');
                
                const himno = window.state.songs[window.state.liveState.songId];
                if (himno && himno.urlsInstrumentos && himno.urlsInstrumentos[selectedInstrument]) {
                    waitBox.classList.add('hidden');
                    singleImg.src = himno.urlsInstrumentos[selectedInstrument];
                } else {
                    singleImg.classList.add('hidden');
                    waitBox.classList.remove('hidden');
                }
            } else {
                waitBox.classList.add('hidden');
                singleImg.classList.add('hidden');
                contentWrapper.classList.remove('hidden');
                libreScroll.classList.remove('hidden');
                libreScroll.innerHTML = ''; 

                window.state.activeSet.forEach(id => {
                    const himno = window.state.songs[id];
                    if (himno && himno.urlsInstrumentos && himno.urlsInstrumentos[selectedInstrument]) {
                        const img = document.createElement('img');
                        img.src = himno.urlsInstrumentos[selectedInstrument];
                        img.className = "w-full mb-12 border-b-4 border-slate-800 pb-12";
                        libreScroll.appendChild(img);
                    }
                });
            }
            lucide.createIcons();
        }

        // Lógica del Proyector Integrada (La versión que sí funcionaba)
        function renderProyectorPantalla() {
            if (activeRole !== 'projector') return;

            const container = document.getElementById('projectionText');
            const panel = document.getElementById('projectorPanel');
            
            panel.classList.remove('hidden');
            if (window.state.liveState.blackout) {
                container.classList.add('blackout');
            } else {
                container.classList.remove('blackout');
            }

            const himno = window.state.songs[window.state.liveState.songId];
            if (himno && himno.letra) {
                const estrofas = himno.letra.split(/\n\s*\n/).map(e => e.trim());
                container.textContent = estrofas[window.state.liveState.verseIndex] || '';
            } else {
                container.innerHTML = `<span class="text-slate-800 font-light italic text-4xl">OrquestaSIONsync Listo</span>`;
            }
        }
        
        // ... (resto de funciones) ...
    </script>
</body>
</html>
